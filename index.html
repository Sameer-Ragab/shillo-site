<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/shillo-site/">
  <script>
    // Perf: cap render pixel ratio so Flutter (CanvasKit) doesn't paint at full 3x on phones (fixes scroll jank).
    (function(){var MAX=1.5;try{var real=window.devicePixelRatio||1;if(real>MAX){Object.defineProperty(window,'devicePixelRatio',{get:function(){return MAX;},configurable:true});}}catch(e){}})();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c2ff0">
  <meta name="description" content="شِلّو — اللعب يحلى باللّمة. دومينو أونلاين، كويز جماعي، تحدّي واحد لواحد وحاسبة نقط.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shillo_landing">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>شِلّو</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<style>
  html,body{margin:0;height:100%}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f6effb;color:#7c2ff0;font:800 44px/1 system-ui,sans-serif;z-index:0;transition:opacity .4s}
  #splash i{width:34px;height:34px;border-radius:50%;border:4px solid rgba(124,47,240,.18);border-top-color:#7c2ff0;animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-color-scheme:dark){#splash{background:#140126;color:#b78bff}}
</style>
<div id="splash"><span>شِلّو</span><i></i></div>
<script>window.addEventListener('flutter-first-frame',function(){var s=document.getElementById('splash');if(s){s.style.opacity=0;setTimeout(function(){s.remove()},450)}});</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
